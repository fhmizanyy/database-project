<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IIUM MarketPlace</title>
    <link rel="stylesheet" href="css/marketPlace.css">
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/bottomheader.css">

  </head>
  <body>

      <div class="market-header">
        <div class="market-left-section">
          
          <span class="js-menu-btn" style="font-size:30px;cursor:pointer">&#9776;</span>
          <img class="IIUM-logo" src="images/icons/Official_Logo_IIUM_Tawhidic_Kanan_FullCMYK.png">
          <p class="IIUM-text-logo">IIUM MARKETPLACE drive portal</p>

        </div>
        <div class="market-mid-section">
          <div class="top-nav-section">
            <input type="text" placeholder="Search products..">

            <button class="search-button">
              <img class="search-icon" src="images/icons/search-icon.jpeg">

            </button>
          </div>
        </div>
        <div class="market-right-section">
          <img class="people-icon" src="images/icons/people.png">
          <img class="logout-icon" href="" src="images/icons/logout-icon.png">
        
          </div>
        </div>

        <div class="side-navigation">
          <div>
            <a href="javascript:void(0)"class="closebtn js-close-btn" >&times;</a>
            <a href="#">Recent History</a>
            <a href="#">Features</a>
            <a href="#">How to use</a>
            <a href="profile.html">My Profile</a>
        </div>
      </div>
      
      <div class="Category-list">
          <button class="category" data-category="All">All</button>
          <button class="category" data-category="Books">Books</button>
          <button class="category" data-category="Electronics">Electronics</button>
          <button class="category" data-category="Furniture">Furniture</button>
          <button class="category" data-category="Clothing">Clothing</button>
          <button class="category" data-category="Stationery">Stationery</button>
          <button class="category" data-category="Sports">Sports</button>
      </div>

      <div class="Main">
        <div class="container-grid js-container-grid">
        </div>
      </div>

      <div class="bottom-Header">
        <div class="bottom-header-inner">
          <div class="sell-section">
            <button class="sell-button js-sell-button">Sell Item +</button>
          </div>
          
          <div class="cart-item-qty">
            <p>Quantity Item :<span class="qty-number js-cart-qty"></span></p>
          </div>
            
          <div class="checkout-section">
            <button class="checkout-button" >Checkout here</button>           
          </div>
          
        </div>
      </div>

          <script type="module" src="script/marketPlace.js"></script>
  </body>
</html>
