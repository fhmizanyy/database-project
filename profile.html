<html>
  <head>
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">

  </head>
  <body>
    
      <div class="market-header">
        <div class="market-left-section">
          
          <span class="js-menu-btn" style="font-size:30px;cursor:pointer">&#9776;</span>
          <img class="IIUM-logo" src="images/icons/Official_Logo_IIUM_Tawhidic_Kanan_FullCMYK.png">
          <p class="IIUM-text-logo">IIUM MARKETPLACE drive portal</p>

        </div>
        <div class="market-mid-section">
          <div class="top-nav-section">
            <input type="text" placeholder="Search products..">

            <button class="search-button">
              <img class="search-icon" src="images/icons/search-icon.jpeg">

            </button>
          </div>
        </div>
        <div class="market-right-section">
          <img class="people-icon" src="images/icons/people.png">
          <img class="logout-icon" href="" src="images/icons/logout-icon.png">
        
          </div>
        </div>

        <div class="side-navigation">
          <div>
            <a href="javascript:void(0)"class="closebtn js-close-btn" >&times;</a>
            <a href="#">Recent History</a>
            <a href="#">Features</a>
            <a href="#">How to use</a>
            <a href="#">My Profile</a>


        </div>
      </div>
      
      <div class ="profile-container">  
        <div class="profile-picture">
           <img class="user-image" src="images/icons/people.png" alt="User Profile Picture">
      </div>
      <div class="user-id">
        1101
      </div>
      <div class="profile-username">
        erissa
      </div>
      <div class="profile-email">
        errissa@live.iium.edu.my
      </div>
      <div class="profile-ratings">
        <img class="" src="rating.png">
          4.8
      </div>
      <div class="user-mahallah">
        mahallah asiah
      </div>

    </div>

    <div class="main-container ">
      <div class="js-container-update-product">

      </div>
    </div>

    <div class="update-poppup-overlay" id="updatePopup">
      <form class="update-form">
        <h3>Update Item:</h3>
        <input type="hidden" id="update-product-id">

        <label id="title">Title:</label>
        <input id="update-title" type="text "placeholder="Enter your title...">

        <label id="quantity">Quantity:</label>
        <input id="update-quantity" type="number">
        <label id="price">Price:</label>
        <input id="update-price" type="number" step="0.01">  

        <div class="popup-buttons">
          <button type="button" class="save-btn" id="saveUpdate">Save changes</button>
          <button type="button" class="cancel-btn" id="closePopup">Cancel</button>
        </div>
      </form>
    </div>

    <script type="module" src="data/profile.js"></script>
    
  </body>
</html>
